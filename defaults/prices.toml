# Giá API, USD / 1M token. Ghi đè riêng: ~/.claude/claude-token-tools/prices.toml (cùng cấu trúc).
# cache_write_5m = 1,25 × input; cache_write_1h = 2 × input.
# assumed = true: giá đọc cache chưa có nguồn chính thức, đang giả định 0,1 × input — kiểm lại khi có số liệu đối chiếu (GĐ2).
# Model id khớp theo tiền tố dài nhất (claude-haiku-4-5-20251001 → claude-haiku-4-5).

